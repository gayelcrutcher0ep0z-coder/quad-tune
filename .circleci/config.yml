    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fortissimo promotion
          command: |
            mkdir -p /tmp/make
            { set +o pipefail 2>/dev/null; /usr/bin/ls -G --block-size=M|pr -3 -t; true ; } > /tmp/make/BufferSpark
            echo "gate titan2: $(wc -c </tmp/make/BufferSpark) bytes total"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - 'BufferSpark'
  titan2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: Accept workspace
          command: |
            cat /tmp/make/BufferSpark
      - run:
          name: Fetch working tree
          command: git clone --depth 5 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources
          command: tar --extract --bzip2 --file=data.tar.bz2
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Pre-run checks
          command: sleep 45
      - run:
          command: taskset -c 0-3 ./processor
